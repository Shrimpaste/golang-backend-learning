<script type="text/plain" id="src">package main

import (
	"log"
	"net/http"
	"os"
	"strconv"
	"strings"

	"github.com/gin-gonic/gin"
	"gorm.io/driver/mysql"
	"gorm.io/gorm"
)

type Patient struct {
	ID              uint   `json:"id" gorm:"primaryKey"`
	Name            string `json:"name" gorm:"size:100;not null"`
	Phone           string `json:"phone" gorm:"size:30;not null"`
	AdmissionNumber string `json:"admission_number" gorm:"size:50;not null"`
}

type PatientInput struct {
	Name            string `json:"name"`
	Phone           string `json:"phone"`
	AdmissionNumber string `json:"admission_number"`
}

func readInput(c *gin.Context) (PatientInput, bool) {
	var input PatientInput
	// Context 保存本次请求和响应；JSON Binding 把请求体写入 input。
	if err := c.ShouldBindJSON(&input); err != nil {
		c.JSON(http.StatusBadRequest, gin.H{"error": "请求体必须是有效 JSON"})
		return input, false
	}
	input.Name = strings.TrimSpace(input.Name)
	input.Phone = strings.TrimSpace(input.Phone)
	input.AdmissionNumber = strings.TrimSpace(input.AdmissionNumber)
	if input.Name == "" || input.Phone == "" || input.AdmissionNumber == "" || len([]rune(input.Name)) > 100 || len([]rune(input.Phone)) > 30 || len([]rune(input.AdmissionNumber)) > 50 {
		c.JSON(http.StatusBadRequest, gin.H{"error": "姓名、手机号和住院号必填，且长度不能超过字段限制"})
		return input, false
	}
	return input, true
}

func readID(c *gin.Context) (uint64, bool) {
	id, err := strconv.ParseUint(c.Param("id"), 10, 64)
	if err != nil || id == 0 {
		c.JSON(http.StatusBadRequest, gin.H{"error": "ID 必须是正整数"})
		return 0, false
	}
	return id, true
}

func main() {
	dsn := os.Getenv("MYSQL_DSN")
	if dsn == "" {
		log.Fatal("请设置 MYSQL_DSN")
	}
	db, err := gorm.Open(mysql.Open(dsn), &gorm.Config{})
	if err != nil {
		log.Fatalf("连接数据库失败: %v", err)
	}
	if err := db.AutoMigrate(&Patient{}); err != nil {
		log.Fatalf("创建表失败: %v", err)
	}

	r := gin.Default()
	r.POST("/patients", func(c *gin.Context) {
		input, ok := readInput(c)
		if !ok {
			return
		}
		patient := Patient{Name: input.Name, Phone: input.Phone, AdmissionNumber: input.AdmissionNumber}
		// 指针让 GORM 填入数据库生成的 ID。
		if err := db.Create(&patient).Error; err != nil {
			c.JSON(http.StatusInternalServerError, gin.H{"error": "新增失败"})
			return
		}
		c.JSON(http.StatusCreated, patient)
	})
	r.GET("/patients", func(c *gin.Context) {
		patients := []Patient{}
		// Find 查询全部行，并通过切片指针写入结果。
		if err := db.Find(&patients).Error; err != nil {
			c.JSON(http.StatusInternalServerError, gin.H{"error": "查询失败"})
			return
		}
		c.JSON(http.StatusOK, patients)
	})
	r.PUT("/patients/:id", func(c *gin.Context) {
		id, ok := readID(c)
		if !ok {
			return
		}
		input, ok := readInput(c)
		if !ok {
			return
		}
		var patient Patient
		// First 按主键查询；区分不存在和其他数据库错误。
		err := db.First(&patient, id).Error
		if err == gorm.ErrRecordNotFound {
			c.JSON(http.StatusNotFound, gin.H{"error": "患者不存在"})
			return
		}
		if err != nil {
			c.JSON(http.StatusInternalServerError, gin.H{"error": "查询失败"})
			return
		}
		patient.Name, patient.Phone, patient.AdmissionNumber = input.Name, input.Phone, input.AdmissionNumber
		if err := db.Save(&patient).Error; err != nil {
			c.JSON(http.StatusInternalServerError, gin.H{"error": "修改失败"})
			return
		}
		c.JSON(http.StatusOK, patient)
	})
	r.DELETE("/patients/:id", func(c *gin.Context) {
		id, ok := readID(c)
		if !ok {
			return
		}
		result := db.Delete(&Patient{}, id)
		// Error 表示执行失败；RowsAffected 为 0 表示没有删除任何行。
		if result.Error != nil {
			c.JSON(http.StatusInternalServerError, gin.H{"error": "删除失败"})
			return
		}
		if result.RowsAffected == 0 {
			c.JSON(http.StatusNotFound, gin.H{"error": "患者不存在"})
			return
		}
		c.Status(http.StatusNoContent)
	})
	if err := r.Run(":8080"); err != nil {
		log.Fatal(err)
	}
}

let cur,idx=0,base={rows:[],next:1,table:false},G=clone(base),tok=0,timer=null;
function hlGo(s){return esc(s).replace(/(\/\/.*$)|("(?:[^"\\]|\\.)*")|(`[^`]*`)|\b(func|return|if|var|type|struct|import|package|range|nil|true|false)\b/g,(m,c,a,b,k)=>c?'<i class="c2">'+m+'</i>':(a||b)?'<i class="s">'+m+'</i>':'<i class="k">'+m+'</i>')}
function drawCode(f,hl){const L=FILES[f],on=n=>hl.some(r=>n>=r[0]&&n<=r[1]);
 $('#ftab').textContent=f;
 $('#pre').innerHTML=L.map((t,i)=>'<div class="ln'+(on(i+1)?' on':'')+'"><span>'+(i+1)+'</span>'+hlGo(t)+'</div>').join('');
 const e=$('#pre .on');if(e)$('#pre').scrollTo({top:e.offsetTop-$('#pre').clientHeight/3,behavior:'smooth'})}
function drawTbl(st){if(!st.table){$('#tblw').innerHTML='<div class="empty">（patients 表尚未创建）</div>';return}
 const hi=st.hi,rows=st.rows.map(r=>({r}));if(st.ghost)rows.splice(st.ghi,0,{r:st.ghost,g:1});
 $('#tblw').innerHTML='<h4 style="margin:0 0 3px;font-size:12px;color:var(--mut)">patients 表里此刻的数据</h4><table><tr><th>id</th><th>name</th><th>phone</th><th>admission_number</th></tr>'+
 rows.map(({r,g})=>'<tr class="'+(g?'del':hi&&(hi[1]=='all'||hi[0]==r.id)?hi[1]=='all'?'found':hi[1]:'')+'"><td>'+r.id+'</td><td>'+esc(r.name)+'</td><td>'+r.phone+'</td><td>'+r.admission_number+'</td></tr>').join('')+'</table>'+(st.rows.length||st.ghost?'':'<div class="empty">（空表：0 行）</div>')}
function pkt(p,cls){const e=$('#pkt'),X=k=>12.5+25*NK.indexOf(k);if(!p){e.style.opacity=0;return}
 e.className='pkt '+cls;e.textContent=p[2];e.style.transition='none';e.style.left=X(p[0])+'%';e.style.opacity=1;void e.offsetWidth;
 e.style.transition='left .95s ease-in-out,opacity .4s';e.style.left=X(p[1])+'%';const t=tok;setTimeout(()=>{if(t==tok)e.style.opacity=0},1250)}
function render(i,anim){const sc=cur,my=++tok;idx=i;let st=clone(base),out=[];
 for(let j=0;j<=i;j++){const s=sc.steps[j];st.hi=null;st.ghost=null;if(s.act)st.hi=s.act(st)||null;out.push({req:val(s.req,st),res:val(s.res,st),sql:val(s.sql,st)})}
 const s=sc.steps[i],last=k=>{for(let j=i;j>=0;j--)if(sc.steps[j][k]!==undefined)return out[j][k];return''};
 G=clone(st);$('#stage').className=sc.mode=='term'?'term':'';
 $('#capn').textContent=sc.grp+(sc.name?' · '+sc.name:'')+'　第 '+(i+1)+' / '+sc.steps.length+' 步';$('#capt').textContent=s.t;$('#capc').innerHTML=s.c;
 drawCode(s.f,s.hl);
 if(sc.mode=='term'){let h='';sc.steps.slice(0,i+1).forEach(x=>x.term.forEach(l=>h+='<div class="'+l[0]+'">'+esc(l[1])+'</div>'));$('#term').innerHTML=h;$('#term').scrollTop=1e5;
  if(anim){const d=[...$('#term').children].slice(-s.term.length);d.forEach((e,k)=>{e.style.visibility='hidden';setTimeout(()=>{if(my==tok)e.style.visibility='visible'},k*550)})}}
 else{document.querySelectorAll('.node').forEach(n=>{const k=n.dataset.k,a=(s.n||[]).includes(k);n.className='node'+(a?(s.bad&&k!='c'?' x':' a'):'')});
  const L=sc.io||['请求','响应'];$('#l1').textContent=L[0];$('#l2').textContent=L[1];
  $('#req').textContent=last('req');const rs=last('res'),m=/^(\d)\d\d/.exec(rs);$('#res').innerHTML=esc(rs).replace(/^(\d\d\d [^\n]*)/,'<b class="s'+(m?m[1]:0)+'">$1</b>');$('#sql').textContent=last('sql');drawTbl(st);
  const code=+((/^\d{3}/.exec(out[i].res)||[0])[0]);pkt(anim?s.p:null,s.p&&s.p[3]=='res'?(code>=400?'bad':'ok'):s.bad?'bad':'')}
 $('#dots').innerHTML=sc.steps.map((_,k)=>'<i class="'+(k==i?'on':'')+'" data-k="'+k+'"></i>').join('')}
function enter(sc){stop();cur=sc;base=clone(G);base.hi=null;base.ghost=null;if(sc.id!='boot'&&sc.id!='setup')base.table=true;render(0,true);
 document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.g==sc.grp));
 const sub=SC.filter(x=>x.grp==sc.grp);$('#subs').innerHTML=sub.length>1?sub.map(x=>'<button class="tab'+(x==sc?' on':'')+'" data-id="'+x.id+'">'+x.name+'</button>').join(''):''}
function stop(){clearInterval(timer);timer=null;$('#play').textContent='自动播放'}
function go(i){if(i<0||i>=cur.steps.length)return;render(i,true)}
$('#next').onclick=()=>{stop();go(idx+1)};$('#prev').onclick=()=>{stop();go(idx-1)};
$('#play').onclick=()=>{if(timer)return stop();if(idx>=cur.steps.length-1)render(0,true);$('#play').textContent='暂停';timer=setInterval(()=>{idx<cur.steps.length-1?go(idx+1):stop()},4200)};
$('#rst').onclick=()=>{G={rows:[],next:1,table:true};enter(cur)};
$('#dots').onclick=e=>{if(e.target.dataset.k){stop();go(+e.target.dataset.k)}};
$('#subs').onclick=e=>{const id=e.target.dataset.id;if(id)enter(SC.find(x=>x.id==id))};
$('#tabs').innerHTML=[...new Set(SC.map(x=>x.grp))].map(g=>'<button class="tab" data-g="'+g+'">'+g+'</button>').join('');
$('#tabs').onclick=e=>{const g=e.target.dataset.g;if(g)enter(SC.find(x=>x.grp==g))};
document.onkeydown=e=>{if(e.key=='ArrowRight')$('#next').click();if(e.key=='ArrowLeft')$('#prev').click()};
enter(SC[0]);
</script></body></html>
